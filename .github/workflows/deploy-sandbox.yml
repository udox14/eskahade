name: Deploy Sandbox to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm_worker:
        description: 'Manual release only: type eskahade-sandbox to confirm sandbox'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-eskahade-sandbox
  cancel-in-progress: false

jobs:
  deploy-sandbox:
    if: github.ref == 'refs/heads/main'
    name: Manual sandbox deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ENV: sandbox
      CLOUDFLARE_ACCOUNT_ID: a170ed4144c00927988a828aa9a41896
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
      WRANGLER_SEND_METRICS: 'false'
      ESKAHADE_CONFIRM_WORKER: ${{ inputs.confirm_worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate shared environment topology
        run: node scripts/validate-sandbox-config.cjs
      - name: Validate explicit sandbox target and permanent isolation
        run: node scripts/validate-manual-deploy.cjs sandbox
      - name: Build reviewed sandbox application
        env:
          NODE_OPTIONS: --require=./scripts/stabilization/isolation/build-no-dotenv.cjs
        run: >-
          node node_modules/next/dist/bin/next build --webpack &&
          node node_modules/@opennextjs/cloudflare/dist/cli/index.js build
          --config wrangler.jsonc --env sandbox --skipNextBuild
      - name: Recheck target before manual deployment
        run: node scripts/validate-manual-deploy.cjs sandbox
      - name: Deploy existing sandbox Worker only
        run: >-
          node node_modules/@opennextjs/cloudflare/dist/cli/index.js deploy
          --config wrangler.jsonc --env sandbox --keep-vars
          --experimental-provision=false --experimental-auto-create=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NODE_OPTIONS: --require=./scripts/stabilization/isolation/build-no-dotenv.cjs
