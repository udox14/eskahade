<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ESKAHADE — Tidak ada koneksi</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fafaf9; color: #0f172a; }
    @media (prefers-color-scheme: dark) { body { background: #020617; color: #e2e8f0; } p { color: #94a3b8 !important; } }
    main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.5rem; font-size: .9rem; line-height: 1.5; color: #475569; }
    button { border: 0; border-radius: .6rem; padding: .7rem 1.4rem; font-weight: 600; font-size: .9rem; background: #15803d; color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Tidak ada koneksi internet</h1>
    <p>ESKAHADE membutuhkan internet. Periksa sambungan data atau Wi-Fi, lalu coba lagi.</p>
    <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Coba lagi</button>
  </main>
</body>
</html>
